# Spoken phrase -> the tree/node it must open. `plb test` fails if any of these drift.
# Realistic things a stressed person might say, not just the menu wording.
# Each is also registered as a phrase in its tree, so voice lands on the right step.
# DRAFT wording for Charlie's review.

# bleeding: is it life-threatening?
"bleeding": bleeding/start
"heavy bleeding": bleeding/start
"bleeding won't stop": bleeding/start
"how do i stop bleeding": bleeding/start
"how do i stop the bleeding": bleeding/start
"stop the bleeding": bleeding/start
"help someone is bleeding": bleeding/start
"there's so much blood": bleeding/start
"lots of blood": bleeding/start
"blood is spurting": bleeding/start
"blood is pumping out": bleeding/start
"my friend was shot": bleeding/start
"gunshot wound": bleeding/start
"stab wound": bleeding/start
"someone got stabbed": bleeding/start
"deep cut": bleeding/start
"amputation": bleeding/start

