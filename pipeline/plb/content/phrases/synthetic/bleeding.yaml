# Synthetic utterances for the voice stress test (plb voice). HELD-OUT: don't copy these
# into the tree's phrases wholesale, or the test stops measuring anything. Add a phrase to
# the tree when the report shows a real gap, then write a few new utterances for that gap.
#
# Written by Claude (LLM) 2026-11-08 for Charlie's review: everyday and backcountry
# civilian speech, stressed and casual, first and third person, kids and adults, a few
# speech-to-text slips. Violent/military wording kept out on purpose.
#
# expect: node -> utterances that should open it. "utterance | other/node" lists extra
#   nodes that are also a fine answer.
# off_topic: topic (no tree yet, or another tree) -> utterances that must NOT open a
#   Bleeding card. Once that topic has a tree, they must land in it instead.

