# the router uses (0 other, 1 body_part, 2 mechanism, 3 symptom, 4 negation, 5 quantity).
# These words are always in the lexicon, even before a tree mentions them, so the
# recognizer can hear them and the router can learn them. Everyday backcountry speech,
# violent/military wording left out on purpose (Charlie 2026-11-08).
# Written by Claude 2026-11-16 as a DRAFT for Charlie's review.

