# Router topics: what the always-loaded voice router chooses between after the first
# thing someone says at Home. Each topic opens one tree (`open`) and lists every draft
# tree it covers (`trees`, used to harvest training words from labels).
#
# `train`: seed utterances the router learns from (the desktop generator adds many more).
# `test`:  HELD-OUT utterances, never trained on. Don't copy them into `train`, or the
#          score stops meaning anything; write new ones for gaps the report shows.
#
# `pin`: life-threat word groups. If every word of a group is heard (any order, in any of
#   the recognizer's guesses), that topic is ALWAYS on the 3 tiles, and nothing else opens on
#   its own. A hard rule, not learned: "baby is limp and not breathing" must never rank 12th.
#
# Written by Claude 2026-11-16 as a DRAFT for Charlie's review: everyday backcountry
# speech (first and third person, stressed, casual), violent/military wording left out.
# Tree ids are the 11-10 drafts in trees-draft-all; they will change when trees are signed off.

reject:            # things that must open nothing ("say that again" screen)
  train:
    - what time is it
    - play some music
    - how far is the trailhead
    - what's for dinner
    - turn on the flashlight
    - is it going to be sunny tomorrow
    - hello
    - never mind
    - testing testing
    - i like this view
    - how many miles today
    - call my mom
  test:
    - what's the weather on saturday
    - tell me a joke
    - where did i park
    - um okay
    - nice day for a hike
    - how much battery is left

