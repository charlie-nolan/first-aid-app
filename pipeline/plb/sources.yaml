# Source manuals for the Pocket First-Aid Librarian library.
# Only US Government works marked "Approved for public release; distribution is unlimited".
# sha256 is filled in by `plb fetch` / `plb verify` once the PDF is on disk; the build refuses
# a PDF whose hash doesn't match a recorded one.
manuals:
  - id: ATP4-02.11
    title: "Casualty Response, Tactical Combat Casualty Care, and First Aid"
    publisher: Headquarters, Department of the Army
    edition: "2026-03-23 (released; supersedes TC 4-02.1)"
    distribution: unverified   # check the cover once downloaded
    urls:
      - https://armypubs.army.mil/epubs/DR_pubs/DR_a/ARN46159-ATP_4-02.11-000-WEB-1.pdf
    role: primary first-aid source (Charlie, 2026-11-04)
    notes: "Supersession per army.mil article 291504 (2026-04-01)."
    file: sources/ATP_4-02.11.pdf
    sha256: null

  - id: TC4-02.1
    title: "First Aid"
    publisher: Headquarters, Department of the Army
    edition: "January 2016, with Change 1 and Change 2 (December 2018)"
    distribution: "Approved for public release; distribution is unlimited"
    status: superseded by ATP 4-02.11 (2026-03-23)
    role: backup only, for diagrams or topics ATP 4-02.11 lacks (Charlie, 2026-11-04)
    urls:
      - https://ciehub.info/ref/TC/4-02x1_2018.pdf   # mirror; prefer an armypubs/archive.org copy
    file: sources/TC_4-02.1.pdf
    sha256: null

  - id: ATP3-50.21
    title: "Survival"
    publisher: Headquarters, Department of the Army
    edition: "September 2018"
    distribution: "Approved for public release; distribution is unlimited"   # confirmed from cover text
    urls:
      - https://irp.fas.org/doddir/army/atp3-50-21.pdf
    notes: "Supersedes FM 3-05.70 (2002), which superseded FM 21-76 (1992)."
    file: sources/ATP_3-50.21.pdf
    sha256: null

  - id: FM21-76
    title: "Survival"
    publisher: Headquarters, Department of the Army
    edition: "June 1992"
    distribution: "Approved for public release; distribution is unlimited"
    status: superseded; kept only for diagrams missing from ATP 3-50.21
    urls: []   # archive.org copy to be chosen
    file: sources/FM_21-76.pdf
    sha256: null

  - id: AFH10-644
    title: "Survival, Evasion, Resistance, Escape (SERE) Operations"
    publisher: Department of the Air Force
    edition: "27 March 2017"
    distribution: unverified
    urls:
      - https://irp.fas.org/doddir/usaf/afh10-644.pdf
      - https://static.e-publishing.af.mil/   # official host; exact path TBD
    file: sources/AFH_10-644.pdf
    sha256: null

