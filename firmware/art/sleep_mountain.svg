<svg xmlns="http://www.w3.org/2000/svg" width="250" height="122" viewBox="0 0 250 122">
 <rect width="250" height="122" fill="#fff"/>
 <!-- sun -->
 <circle cx="222" cy="18" r="8" fill="none" stroke="#000" stroke-width="1.6"/>
 <g stroke="#000" stroke-width="1.4">
  <line x1="222" y1="3" x2="222" y2="7"/><line x1="222" y1="29" x2="222" y2="33"/>
  <line x1="207" y1="18" x2="211" y2="18"/><line x1="233" y1="18" x2="237" y2="18"/>
  <line x1="211" y1="7" x2="214" y2="10"/><line x1="230" y1="26" x2="233" y2="29"/>
  <line x1="233" y1="7" x2="230" y2="10"/><line x1="214" y1="26" x2="211" y2="29"/>
 </g>
 <!-- far ridgelines, strokes only -->
 <path d="M0,60 L10,52 L18,56 L30,44" fill="none" stroke="#000" stroke-width="1.3"/>
 <path d="M170,40 L184,30 L196,38 L206,32 L216,44 L230,36 L250,50" fill="none" stroke="#000" stroke-width="1.3"/>
 <!-- mountains: outline, shadow faces black, snow caps white -->
 <path d="M18,86 L58,24 L72,40 L104,8 L124,32 L136,26 L164,86 Z" fill="#fff"/>
 <path d="M58,24 L72,40 L66,86 L48,86 L62,50 Z" fill="#000"/>
 <path d="M104,8 L124,32 L136,26 L164,86 L104,86 L114,50 Z" fill="#000"/>
 <path d="M104,8 L116,23 L111,23 L113,31 L108,27 L106,34 L103,26 L99,30 L98,22 L94,22 Z" fill="#fff"/>
 <path d="M136,26 L144,40 L140,39 L139,45 L135,40 L132,43 L131,34 Z" fill="#fff"/>
 <path d="M58,24 L64,33 L60,33 L60,38 L56,34 L53,36 L54,30 Z" fill="#fff"/>
 <path d="M18,86 L58,24 L72,40 L104,8 L124,32 L136,26 L164,86" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/>
 <g stroke="#000" stroke-width="1">
  <line x1="88" y1="40" x2="80" y2="56"/><line x1="94" y1="46" x2="86" y2="66"/>
  <line x1="40" y1="64" x2="34" y2="76"/><line x1="46" y1="62" x2="42" y2="72"/>
 </g>
 <path d="M94,22 L98,22 L99,30 L103,26 L106,34" fill="none" stroke="#000" stroke-width="1"/>
 <!-- snowfield -->
 <path d="M0,86 Q70,80 140,85 T250,82" fill="none" stroke="#000" stroke-width="1.4"/>
 <!-- left pines -->
 <g fill="#000">
  <path d="M4,104 L13,64 L22,104 Z"/><rect x="12" y="103" width="2" height="5"/>
  <path d="M20,106 L27,78 L34,106 Z"/>
 </g>
 <!-- tent, flap open -->
 <path d="M42,106 L60,84 L78,106 Z" fill="#fff" stroke="#000" stroke-width="1.6"/>
 <path d="M60,84 L60,106 L68,106 Z" fill="#000"/>
 <line x1="60" y1="84" x2="60" y2="79" stroke="#000" stroke-width="1.4"/>
 <path d="M60,79 L66,81 L60,83" fill="#000"/>
 <!-- campfire, out -->
 <g stroke="#000" stroke-width="1.6"><line x1="84" y1="106" x2="94" y2="102"/><line x1="84" y1="102" x2="94" y2="106"/></g>
 <path d="M88,98 q-2,-3 0,-6 q2,-2 0,-5" fill="none" stroke="#000" stroke-width="1"/>
 <!-- footprints from tent to sasquatch -->
 <g fill="#000">
  <ellipse cx="104" cy="105" rx="2.6" ry="1.4"/><ellipse cx="114" cy="101" rx="2.6" ry="1.4"/>
  <ellipse cx="124" cy="105" rx="2.6" ry="1.4"/><ellipse cx="134" cy="101" rx="2.6" ry="1.4"/>
  <ellipse cx="144" cy="105" rx="2.6" ry="1.4"/><ellipse cx="154" cy="101" rx="2.6" ry="1.4"/>
 </g>
 <!-- SASQUATCH: classic side-view stride (walking right, toward the trees), cooler swinging behind -->
 <g transform="translate(172,54) scale(0.34)" fill="#000" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
  <!-- back arm (behind the body) holding the cooler -->
  <polyline points="46,32 30,54 16,74" fill="none" stroke-width="12"/>
  <!-- back leg pushing off, heel up -->
  <polyline points="44,86 32,116 14,140" fill="none" stroke-width="17"/>
  <path d="M18,136 L8,152 L-8,155 L-4,146 Z" stroke-width="3"/>
  <!-- head: crest at the back, heavy brow, jaw forward -->
  <path d="M46,24 L48,8 L54,1 L62,4 L68,12 L71,18 L70,24 L66,28 L54,30 Z" stroke-width="2"/>
  <!-- torso: hunched back, deep chest -->
  <path d="M46,20 Q30,34 32,58 Q32,78 38,92 L62,94 Q70,74 70,52 Q70,34 64,26 Z" stroke-width="2"/>
  <!-- front leg striding forward -->
  <polyline points="56,86 76,114 86,146" fill="none" stroke-width="18"/>
  <path d="M78,144 L104,147 L106,155 L76,156 Z" stroke-width="3"/>
  <!-- front arm swinging forward -->
  <polyline points="58,32 76,52 90,72" fill="none" stroke-width="12"/>
  <!-- fur tufts on back, elbows, calves -->
  <path d="M33,44 L26,48 L32,52 Z M31,62 L25,68 L32,70 Z M33,58 L28,60 L32,64 Z  M30,58 L24,62 L30,64 Z" stroke-width="1"/>
 </g>
 <!-- eye glint (glancing back at the camp) -->
 <circle cx="193" cy="58" r="0.9" fill="#fff"/>
 <!-- the stolen cooler -->
 <rect x="167" y="78" width="13" height="10" rx="1.5" fill="#fff" stroke="#000" stroke-width="1.5"/>
 <line x1="167" y1="81.5" x2="180" y2="81.5" stroke="#000" stroke-width="1.2"/>
 <!-- right pines -->
 <g fill="#000">
  <path d="M216,108 L226,62 L236,108 Z"/>
  <path d="M230,108 L240,72 L250,108 Z"/>
 </g>
 <!-- bottom band for the firmware's text line -->
 <line x1="0" y1="110" x2="250" y2="110" stroke="#000" stroke-width="1"/>
</svg>
