<svg xmlns="http://www.w3.org/2000/svg" width="250" height="122" viewBox="0 0 250 122">
 <rect width="250" height="122" fill="#fff"/>
 <!-- sun low over the pass -->
 <circle cx="125" cy="22" r="7" fill="none" stroke="#000" stroke-width="1.3"/>
 <!-- far peaks, outline only, with snow lines -->
 <path d="M0,52 L18,30 L30,40 L52,10 L70,34 L84,26 L104,48" fill="none" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/>
 <path d="M146,48 L166,24 L178,32 L198,6 L216,30 L230,22 L250,44" fill="none" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/>
 <g fill="none" stroke="#000" stroke-width="1">
  <path d="M44,22 L48,26 L52,20 L56,27 L60,22"/>
  <path d="M190,18 L194,22 L198,16 L202,23 L206,18"/>
  <path d="M14,36 L18,39 L22,35"/><path d="M226,27 L230,30 L234,26"/>
 </g>
 <!-- shadow faces: light diagonal hatching -->
 <g stroke="#000" stroke-width="0.9">
  <line x1="56" y1="18" x2="64" y2="40"/><line x1="62" y1="26" x2="70" y2="46"/>
  <line x1="202" y1="14" x2="210" y2="36"/><line x1="208" y1="22" x2="216" y2="42"/>
 </g>
 <!-- valley walls sweeping down to the floor -->
 <path d="M0,70 Q40,58 80,64 Q105,68 118,58" fill="none" stroke="#000" stroke-width="1.3"/>
 <path d="M250,70 Q210,58 170,64 Q145,68 132,58" fill="none" stroke="#000" stroke-width="1.3"/>
 <path d="M104,48 Q114,54 118,58 M146,48 Q136,54 132,58" fill="none" stroke="#000" stroke-width="1.3"/>
 <!-- river winding down the valley toward the viewer -->
 <path d="M125,58 Q118,66 128,72 Q140,80 122,88 Q104,96 126,106" fill="none" stroke="#000" stroke-width="1.2"/>
 <path d="M126,58 Q122,66 132,72 Q146,80 128,88 Q112,96 136,106" fill="none" stroke="#000" stroke-width="1.2"/>
 <!-- small far pines on the slopes -->
 <g fill="#000">
  <path d="M36,66 L39,56 L42,66Z"/><path d="M44,65 L46,58 L48,65Z"/><path d="M90,64 L93,55 L96,64Z"/>
  <path d="M206,66 L209,56 L212,66Z"/><path d="M200,65 L202,58 L204,65Z"/><path d="M156,64 L159,55 L162,64Z"/>
 </g>
